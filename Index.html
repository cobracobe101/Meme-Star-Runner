<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meme-Star Runner</title>

<style>
/* RESET */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* PAGE */
body {
  min-height: 100vh;
  background: #0b0b0f;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
}

/* HERO */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
}

/* LOGO */
.hero img {
  max-width: 320px;
  width: 90%;
  height: auto;
  margin-bottom: 30px;
}

/* TEXT */
.hero p {
  max-width: 600px;
  color: #9ca3af;
  font-size: 1.05rem;
  margin-bottom: 25px;
  line-height: 1.5;
}

/* PAY BUTTON WRAP */
.pay-wrap {
  margin: 10px 0 15px;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 25px;
  font-size: 0.8rem;
  color: #6b7280;
}
</style>
</head>

<body>

<div class="hero">

  <!-- LOGO -->
  <img src="meme-star-runner.png" alt="Meme-Star Runner Logo">

  <!-- DESCRIPTION -->
  <p>
    A live meme-coin billboard.<br>
    $1 in Bitcoin gets your meme coin featured for 24 hours.
  </p>

  <!-- BITCOIN PAY BUTTON -->
  <div class="pay-wrap">
    <a href="" class="blockoPayBtn" data-toggle="modal" data-uid="32a3fea8442c4112">
      <img width="160" src="https://www.blockonomics.co/img/pay_with_bitcoin_medium.png" alt="Pay with Bitcoin">
    </a>
  </div>

  <p style="font-size:0.85rem;">
    After payment, you’ll enter your meme coin details.
  </p>

</div>

<footer>
  Bitcoin-only promotions · Meme-Star Runner
</footer>

<!-- BLOCKONOMICS SCRIPT -->
<script src="https://www.blockonomics.co/js/pay_button.js"></script>

</body>
</html>
