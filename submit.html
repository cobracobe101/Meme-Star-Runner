<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Your Meme Coin</title>

<style>
body {
  background: #020617;
  color: #e5e7eb;
  font-family: Arial, sans-serif;
  padding: 40px 20px;
}

form {
  max-width: 500px;
  margin: auto;
  background: #0f172a;
  padding: 30px;
  border-radius: 16px;
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 8px;
  border: none;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  background: linear-gradient(90deg, #00ffe0, #ff4fd8);
  color: #000;
}
</style>
</head>

<body>

<form name="meme-star-runner" method="POST" data-netlify="true">
  <input type="hidden" name="form-name" value="meme-star-runner">

  <h2>🚀 Submit Your Meme Coin</h2>

  <input name="coin_name" placeholder="Coin Name" required>
  <input name="blockchain" placeholder="Blockchain (Solana, ETH, etc)" required>
  <input name="website" placeholder="Website URL">
  <input name="x" placeholder="X (Twitter) link">
  <input name="telegram" placeholder="Telegram link">

  <button type="submit">Submit</button>

  <p style="color:#9ca3af; font-size:0.8rem;">
    Paid promotional listing only.
  </p>
</form>

</body>
</html>
